<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d946ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#facc15;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#0A0A0A" stroke="url(#grad)" stroke-width="1"/>
  
  <!-- Peptide helix simplified -->
  <path d="M10,8 Q12,12 10,16 T10,24" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M22,8 Q20,12 22,16 T22,24" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Connecting bonds -->
  <line x1="10" y1="12" x2="22" y2="12" stroke="#d946ef" stroke-width="1" opacity="0.8"/>
  <line x1="10" y1="16" x2="22" y2="16" stroke="#d946ef" stroke-width="1" opacity="0.8"/>
  <line x1="10" y1="20" x2="22" y2="20" stroke="#d946ef" stroke-width="1" opacity="0.8"/>
  
  <!-- Center dot representing AI/computational aspect -->
  <circle cx="16" cy="16" r="3" fill="#facc15" opacity="0.9"/>
</svg>