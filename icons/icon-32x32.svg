
<svg width="32" height="32" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0a0a" rx="80"/>
  
  <!-- Protein Structure Icon -->
  <g transform="translate(128, 128)">
    <!-- Main protein chain -->
    <path d="M50 100 Q100 50 150 100 T250 100" 
          stroke="url(#gradient)" 
          stroke-width="12" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Secondary structure -->
    <path d="M75 150 Q125 100 175 150 T275 150" 
          stroke="#3b82f6" 
          stroke-width="8" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Peptide bonds -->
    <circle cx="100" cy="80" r="8" fill="#dc2626"/>
    <circle cx="200" cy="80" r="8" fill="#dc2626"/>
    <circle cx="150" cy="130" r="6" fill="#3b82f6"/>
    <circle cx="250" cy="130" r="6" fill="#3b82f6"/>
    
    <!-- AI/Tech elements -->
    <rect x="200" y="200" width="60" height="60" rx="8" fill="url(#gradient)" opacity="0.8"/>
    <text x="230" y="235" text-anchor="middle" fill="white" font-family="Arial" font-size="20" font-weight="bold">AI</text>
  </g>
</svg>